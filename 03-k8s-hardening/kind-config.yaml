kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# CNI par défaut désactivé pour installer Calico, qui applique réellement les NetworkPolicies
# (le kindnet par défaut ne les applique pas).
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
  - role: worker
